name = "lamha"
main = "worker/index.ts"
compatibility_date = "2025-01-01"

# Custom domain (the lamha.ly zone must be on this Cloudflare account). Remove this block if you only use workers.dev for now.
routes = [
  { pattern = "lamha.ly", custom_domain = true },
  { pattern = "www.lamha.ly", custom_domain = true },
]

[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
EZONE_BASE_URL = "https://test.ezonepay.ly"            # switch to the production Ezone URL when going live
RESELLCODES_BASE_URL = "https://resell.codes/api/v1"
ALLOWED_ORIGINS = "https://lamha.ly,https://www.lamha.ly"
# Secrets (never here): Cloudflare > Workers > lamha > Settings > Variables and Secrets.

[triggers]
crons = ["*/2 * * * *"]
