<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b172a">
<title>لمحة | LAMHA</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script>
window.addEventListener("error", function(e) {
  if (!document.body) return;
  document.body.innerHTML = "<pre style='color:#fff;background:#111;padding:16px;white-space:pre-wrap;font-size:13px'>JS ERROR:\n" + (e.message || e) + "\nFile: " + (e.filename || "") + ":" + (e.lineno || "") + "</pre>";
});
window.addEventListener("unhandledrejection", function(e) {
  if (!document.body) return;
  document.body.innerHTML = "<pre style='color:#fff;background:#111;padding:16px;white-space:pre-wrap;font-size:13px'>PROMISE ERROR:\n" + (e.reason && (e.reason.message || e.reason)) + "</pre>";
});
</script>
</head>
<body>
<div id="app"></div>
<nav class="nav"><div id="nav"></div></nav>
<div id="toast"></div>
<div id="ov"></div>
<script src="lib.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
